<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Three</title>
</head>
<body>
    <form>
        <fieldset>
       <legend><h2>Complex Application </h2></legend>
       <fieldset>
        <legend style="color: red">PERSONAL INFORMATION</legend>
        <label for="Name">Name:</label>
       <input type="text" id="Name" name="Name" placeholder="First Name">
       <br>
       <br>

       <label for="Name"> Last Name:</label>
       <input type="text" id="Last Name" name="Last Name" placeholder="Last Name">
       <br>
       <br>

       <label for="Email">Email:</label>
       <input type="text" id="Email" name="Email" placeholder="example@123.com">
       <br>
       <br>

       <label for="Phone">Phone NO:</label>
       <input type="tel" id="Phone" name="Phone" placeholder="+91">
       <br>
       <br>
       <label for="DateofBirthday">Date of Birthday:</label>
       <input type="date" id="DateofBirthday" name="DateofBirthday">
       <br>
       <br>
       
       <span>Choose Gender : </span>
        <label for="male">Male</label>
        <input type="radio" id="male" name="select">
        
        <label for="male">Female</label>
        <input type="radio" id="Female" name="select">

      <br> 
      <br>
        <label for="Country">Country :</label>
        <select name="Country" id="Country">
        <option value="India">India</option>
        <option value="US">United State</option>
        <option value="Russia">Russia</option>
        <option value="Japan">Japan</option>
        </select>
        <br>
        <br>
        <button type="button" id="saveChanges"  style="color:blueviolet">Save</button>
        <button type="next" style="color:blue">Next</button>
       </fieldset>
       <br>
       <br>



       <fieldset>
        <legend style="color: red">ADDRESS:</legend>

        <label for="Address">Address:</label>
       <input type="text" id="Address" name="Address" placeholder="Full Address">
       <br>
       <br>
       <label for="Town">Town:</label>
       <input type="text" id="Town" name="Town" placeholder="town / FAmous Place/ market ">
       <br>
       <br>
       <label for="distric">Distric:</label>
       <input type="text" id="distric" name="distric" placeholder="Distric">
       <br>
       <br>
       <label for="State">State:</label>
       <input type="text" id="state" name="state" placeholder="State">
       <br>
       <br>
       <label for="zip code">Zip Code:</label>
       <input type="code" id="Zip code" name="zip code" placeholder="zip / pin Code" maxlength="6">
       <br>
       <br>
       <button type="button" id="saveChanges"  style="color:blueviolet">Save</button>
       <button type="next" style="color:blue">Next</button>
    </fieldset>
       <br>
       <br>

       <fieldset>
        <legend style="color: red">DOCUMATION:</legend>

        <label for="Inter">Upload Inter Marksheet</label>
        <input type="file" id="Inter" name="Inter">
        <br>
        <br>
        <label for="jee">Upload JEE Score</label>
        <input type="file" id="jee" name="jee">
        <br>
        <br>
        
        <label for="Btech">Upload Marksheet</label>
        <input type="file" id="Btech" name="Btech">
        <br>
        <br>
        
        <label for="photo">Pass Size Photo</label>
        <input type="file" id="photo" name="photo">
        <br>
        <br>
        <button type="button" id="saveChanges"  style="color:blueviolet">Save</button>
       <button type="next" style="color:blue">Next</button>
       </fieldset>
       <br>
       <br>

       <fieldset>
        <legend style="color: red"> OTHER INFORMATION:</legend>
        <label for="text">Comments </label>
        <br>
        <textarea name="text" id="text" cols="30" rows="10" placeholder="Enter you opinion....."></textarea>
        <button type="button" id="saveChanges"  style="color:blueviolet">Save</button>

       </fieldset>
        <br>
        

        <label for="checkbox">I agree to terms of services </label>
        <input type="checkbox" id="checkbox" name="checkbox">
        <br>
        <input type="submit" style="background-color:aqua ;" style="color:brown" value="Finally Submit">
    </fieldset>
    </form>

</body>
</html>
