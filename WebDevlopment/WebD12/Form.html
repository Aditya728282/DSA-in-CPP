<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Events Form </h2>
 <form>
        <label for="Name">Name:</label>
       <input type="text" id="Name" name="Name" placeholder="First Name">
       <br>
       <br>

       <label for="Name"> Last Name:</label>
       <input type="text" id="Last Name" name="Last Name" placeholder="Last Name">
       <br>
       <br>

       <label for="Email">Email:</label>
       <input type="text" id="Email" name="Email" placeholder="example@123.com">
       <br>
       <br>

       <label for="Phone">Phone NO:</label>
       <input type="tel" id="Phone" name="Phone" placeholder="+91">
       <br>
       <br>


        <label for="Occupation">Occupation:</label>
       <select name="Occupation" id="Occupation">

        <option value="Student">Student</option>
        <option value="Professional">Professional</option>
        <option value="Employee">Employee</option>
        <option value="Farmer">Farmer</option>

       </select>

       <br>
       <br>
        
       <fieldset>
        <legend>CHOOSE LANGUAGE</legend>
        <label for="checkbox1">Html</label>
        <input type="checkbox" id="checkbox1">

        <label for="checkbox2">Css</label>
        <input type="checkbox" id="checkbox2">

        <label for="checkbox3">JavaScript</label>      
        <input type="checkbox" id="checkbox3">

        <label for="checkbox4">C++</label>       
        <input type="checkbox" id="checkbox4">         
       </fieldset>

       <br>
       <br>



       <label for="textarea">Comments</label>
       <br>
      <textarea name="textarea" id="textarea" cols="30" rows="10" placeholder="Please Give Your feedback ...."></textarea>
      <br>
      
      <input type="submit"style="color:red" style="background-color: rgb(177, 177, 201);">

 </form>
</body>
</html>
