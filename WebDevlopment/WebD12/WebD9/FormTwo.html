<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form two</title>
</head>
<body>
     <h2>Job Application</h2>
    <form>
        <label for="Name">Name:</label>
       <input type="text" id="Name" name="Name" placeholder="First Name">
       <br>
       <br>

       <label for="Name"> Last Name:</label>
       <input type="text" id="Last Name" name="Last Name" placeholder="Last Name">
       <br>
       <br>

       <label for="Email">Email:</label>
       <input type="text" id="Email" name="Email" placeholder="example@123.com">
       <br>
       <br>

       <label for="Phone">Phone NO:</label>
       <input type="tel" id="Phone" name="Phone" placeholder="+91">
       <br>
       <br>

        <label for="fileUpload">Resume:</label>
       <input type="file" id="fileUpload">
       <br>
       <br>

       <label for="Experience">Experience(in years):</label>
       <input type="number" id="Experience" min="0" max="50">
       <br>
       <br>

       <fieldset>
        <legend style="color: rgb(212, 27, 27);">SKILLS:</legend>
         <label for="checkbox1">Html</label>
         <input type="checkbox"id=checkbox1 name="checkbox1">
         <br>
         <label for="checkbox2">Css  </label>
         <input type="checkbox"id=checkbox2 name="checkbox2">
         <br>
         
         <label for="checkbox3">JavaScript</label>
         <input type="checkbox"id=checkbox3 name="checkbox3">
         <br>
         <label for="checkbox4">Python</label>
         <input type="checkbox"id=checkbox4 name="checkbox4">
         <br>
        
       </fieldset>


         <br>
         <br>

        <label for="Higher Education">Higher Education</label>
       <select name="Higher Education" id="Higher Education">
        <option value="Graduate">Graduate</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Matric">Matric</option>
       </select>
        <br>
        <br>
        
        <fieldset>
            <legend style="color: rgb(212, 27, 27);">Availbility:</legend>
            <label for="radio1">Full-Time</label>
            <input type="radio" id="radio1" name="radio">
            <br>
            <label for="radio2">Part-Time</label>
            <input type="radio" id="radio2" name="radio">

        </fieldset>
        <br>
        <br>

      <label for="textarea">Comments</label>
      <br>
      <textarea name="textarea" id="textarea" cols="30" rows="10" placeholder="Please Give Your feedback ...."></textarea>
      <br>

    
        <input type="submit" style="color:rgb(0, 55, 255);" value="Register">
   
    
    </form>
</body>
</html>
