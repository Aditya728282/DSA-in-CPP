<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        border: 2px solid black;
        background-color:darkolivegreen;
        display:flex;
        flex-direction: row;
        width:500px;
    }
    
    #boxleft{
        border: 2px solid green;
        background-color: brown;
        margin:5px;
        width: 47%;

    }
    #boxright{
        border: 2px solid yellowgreen;
        margin: 5px;
        width : 47%;
    }
    img{
        width: 230px;
    }

    p{
        border: 2px solid red;
    }

    @media(max-width: 640px){
        .container{
            flex-direction: column;
        }
    }
    


</style>


<body>
    <div class="container">
     <div id="boxleft"  >
        <p>Text 1</p>
        <p>Text 2</p>
     </div>
       
     <div id="boxright">
        <img src="Chankya.jpg" alt="">
     </div>
     

    </div>
</body>
</html>
